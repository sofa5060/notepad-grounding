[project]
name = "notepad-grounding"
version = "0.1.0"
description = "Vision-based Windows desktop grounding proof for locating the Notepad shortcut."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.1.0",
    "openai>=2.0.0",
    "pillow>=12.0.0",
    "winrt-Windows.Foundation>=3.2.1; platform_system == 'Windows'",
    "winrt-Windows.Foundation.Collections>=3.2.1; platform_system == 'Windows'",
    "winrt-Windows.Graphics.Imaging>=3.2.1; platform_system == 'Windows'",
    "winrt-Windows.Media.Ocr>=3.2.1; platform_system == 'Windows'",
    "winrt-Windows.Storage>=3.2.1; platform_system == 'Windows'",
    "winrt-Windows.Storage.Streams>=3.2.1; platform_system == 'Windows'",
]

[project.scripts]
notepad-grounding = "notepad_grounding.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
